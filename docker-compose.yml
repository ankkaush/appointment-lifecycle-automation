services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appointment
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: appointment_automation
    ports:
      - "5436:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointment -d appointment_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # overrides .env's localhost DATABASE_URL so the API reaches Postgres
      # over the compose network instead of the host loopback
      DATABASE_URL: postgresql+asyncpg://appointment:changeme@db:5432/appointment_automation
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Background jobs (Phase 6): same image, same Postgres, a different
  # command -- not a new infrastructure component. Coordinates with any
  # other worker instance purely through SKIP LOCKED on scheduled_jobs.
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://appointment:changeme@db:5432/appointment_automation
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.worker

volumes:
  db_data:
