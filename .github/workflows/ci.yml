name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: appointment_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment_automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://appointment:changeme@localhost:5432/appointment_automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  prod-images:
    # Proves the production Dockerfiles (Phase 10 -- see DEPLOYMENT.md)
    # actually build, not just that they parse. Doesn't push anywhere or
    # need real credentials: a build-only check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build -f backend/Dockerfile.prod -t appointment-api-prod backend
      - name: Build frontend production image
        run: |
          docker build -f frontend/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com \
            -t appointment-dashboard-prod frontend

  ai-eval:
    # Golden-set eval for the AI interpretation layer (see eval/run_eval.py).
    # Calls the real Anthropic API, so it's opt-in: add an ANTHROPIC_API_KEY
    # *secret* and an AI_EVAL_ENABLED=true repo *variable* to turn this on.
    # A secret can't be read in a job-level `if`, hence the separate
    # variable flag. Skipped (not failed) without it, so contributors
    # without a key still get full lint/test coverage.
    runs-on: ubuntu-latest
    if: ${{ vars.AI_EVAL_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m eval.run_eval
