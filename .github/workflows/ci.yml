name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        # A full, explicit scan rather than gitleaks/gitleaks-action's
        # default push-event diff range: that range is computed as
        # `<before>^..<head>`, and on the very first push to a new
        # repository/branch `<before>` is the repo's own root commit --
        # which has no parent, so `^` is not a valid revision
        # (gitleaks/gitleaks-action#199). Scanning explicitly avoids
        # depending on that edge case ever again (e.g. a force-push or a
        # rebase would hit the same failure mode).
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact -v

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appointment
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: appointment_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment -d appointment_automation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://appointment:changeme@localhost:5432/appointment_automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next typegen` generates the route/layout types (e.g. LayoutProps)
      # that `next build`/`next dev` normally generate as a side effect --
      # needed here since `tsc --noEmit` runs standalone, before `build`.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  prod-images:
    # Proves the production Dockerfiles (Phase 10 -- see DEPLOYMENT.md)
    # actually build, not just that they parse. Doesn't push anywhere or
    # need real credentials: a build-only check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build -f backend/Dockerfile.prod -t appointment-api-prod backend
      - name: Build frontend production image
        run: |
          docker build -f frontend/Dockerfile.prod \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com \
            -t appointment-dashboard-prod frontend

# The AI golden-set eval (eval/run_eval.py) is intentionally not a CI job:
# it calls the real Anthropic API and costs real money per run. Run it
# manually and on demand instead -- see the README's "Setup / local
# development" section -- the same pattern this author's other AI
# portfolio projects use for their own eval harnesses.
